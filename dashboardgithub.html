<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f7f2;color:#263126}
    .wrap{max-width:1280px;margin:0 auto;padding:24px}
    .hero{background:#365233;color:#fff;border-radius:0 0 28px 28px;padding:28px 30px;margin-bottom:22px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    .logo{display:block;height:36px;width:auto;margin-bottom:14px}.hero h1{margin:0;font-size:30px}.hero p{margin:8px 0 0;opacity:.9}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.refresh{background:#fff;color:#365233;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06)}.label{font-size:13px;color:#667066}.big{font-size:30px;font-weight:700;margin-top:6px}.sub{font-size:12px;color:#7b847b;margin-top:5px}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-bottom:22px}.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06)}.panel h2{font-size:18px;margin:0 0 16px}.row{margin:14px 0}.rowtop{display:flex;justify-content:space-between;gap:12px;font-size:14px}.bar{height:10px;background:#e8ede7;border-radius:10px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#365233;border-radius:10px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3ec;font-size:12px}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf0ec;vertical-align:top}th{font-size:12px;color:#647064} .score{font-weight:700}.good{color:#365233}.attention{color:#8a5b17}.muted{color:#7a837a}.comment{padding:14px 0;border-bottom:1px solid #edf0ec}.comment:last-child{border-bottom:0}.comment .date{font-size:11px;color:#899189;margin-bottom:5px}.comment strong{display:block;margin-bottom:4px}.sectionTitle{margin:28px 0 12px;font-size:20px}.empty{padding:30px;text-align:center;color:#7a837a}.error{background:#fff1f1;color:#8b2222;padding:16px;border-radius:12px}.loading{text-align:center;padding:60px;color:#647064}
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:14px}.hero{padding:22px}.hero h1{font-size:25px}}
    @media(max-width:560px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}table{font-size:12px}.panel{padding:15px}}
  </style>
</head>

<script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(v){if(!v)return ''; const d=new Date(v); return isNaN(d)?esc(v):d.toLocaleString('en-PH',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function scoreClass(v){return v==null?'':v>=4.5?'good':v<3.5?'attention':'';}
function render(d){
  const count=d.responseCount||0;
  const overall=(d.areas||[]).find(x=>x.label==='Overall RLCC Experience');
  const averages=(d.areas||[]).filter(x=>x.average!=null);
  const overallAvg=overall&&overall.average!=null?overall.average:(averages.length?averages.reduce((a,b)=>a+b.average,0)/averages.length:null);
  const latest=d.dailyResponses&&d.dailyResponses.length?d.dailyResponses[d.dailyResponses.length-1]:null;
  let html=`<div class="cards">
    <div class="card"><div class="label">Total Responses</div><div class="big">${count}</div><div class="sub">Unique submitted assessments</div></div>
    <div class="card"><div class="label">Overall RLCC Average</div><div class="big">${overallAvg==null?'—':Number(overallAvg).toFixed(2)}</div><div class="sub">Across Overall RLCC questions</div></div>
    <div class="card"><div class="label">Latest Response</div><div class="big" style="font-size:20px">${latest?esc(latest.date):'—'}</div><div class="sub">${latest?latest.count+' response(s) that day':'No responses yet'}</div></div>
    <div class="card"><div class="label">Questions Rated</div><div class="big">${(d.questions||[]).length}</div><div class="sub">Distinct assessment questions with data</div></div>
  </div>`;
  html+=`<div class="grid"><div class="panel"><h2>Experience by Area</h2>${(d.areas||[]).map(a=>`<div class="row"><div class="rowtop"><span>${esc(a.label)}</span><strong>${a.average==null?'—':a.average.toFixed(2)}</strong></div><div class="bar"><div class="fill" style="width:${a.average==null?0:(a.average/5*100)}%"></div></div><div class="sub">${a.responses} response${a.responses===1?'':'s'}</div></div>`).join('')}</div>
  <div class="panel"><h2>What Stands Out</h2><p class="muted">Highest-rated questions</p>${(d.strongest||[]).slice(0,5).map(q=>`<div class="comment"><strong>${esc(q.criterion)} <span class="pill">${q.average.toFixed(2)}</span></strong><div class="muted">${esc(q.question)}</div></div>`).join('')||'<div class="empty">No ratings yet.</div>'}</div></div>`;
  html+=`<div class="panel"><h2>Areas Needing Attention</h2><table><thead><tr><th>Area</th><th>Dimension</th><th>Average</th><th>Question</th></tr></thead><tbody>${(d.attention||[]).slice(0,10).map(q=>`<tr><td>${esc(q.area)}</td><td>${esc(q.criterion)}</td><td class="score ${scoreClass(q.average)}">${q.average.toFixed(2)}</td><td>${esc(q.question)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No ratings yet.</td></tr>'}</tbody></table></div>`;
  html+=`<div class="sectionTitle">Experience by Service, Circle, and Ministry</div><div class="panel"><table><thead><tr><th>Area</th><th>Service / Circle / Ministry</th><th>Responses</th><th>Average</th></tr></thead><tbody>${(d.subjects||[]).map(s=>`<tr><td>${esc(s.area)}</td><td>${esc(s.subject)}</td><td>${s.responses}</td><td class="score ${scoreClass(s.average)}">${s.average.toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No data yet.</td></tr>'}</tbody></table></div>`;
  html+=`<div class="sectionTitle">Member Feedback</div><div class="panel">${(d.comments||[]).slice(0,20).map(c=>`<div class="comment"><div class="date">${fmtDate(c.timestamp)} · ${esc(c.areas)}</div>${c.helpful?`<strong>What was helpful</strong><div>${esc(c.helpful)}</div>`:''}${c.improve?`<strong style="margin-top:10px">What could improve</strong><div>${esc(c.improve)}</div>`:''}${c.other?`<strong style="margin-top:10px">Other feedback</strong><div>${esc(c.other)}</div>`:''}${c.followUp?`<div class="sub" style="margin-top:8px">Follow-up: ${esc(c.followUp)}</div>`:''}</div>`).join('')||'<div class="empty">No written feedback yet.</div>'}</div>`;
  html+=`<p class="sub" style="text-align:center;margin:24px 0">Dashboard refreshed ${fmtDate(d.generatedAt)}.</p>`;
  document.getElementById('app').innerHTML=html;
}
function getPin(){try{return sessionStorage.getItem('rlccDashPin')||''}catch(e){return ''}}
function setPin(v){try{sessionStorage.setItem('rlccDashPin',v)}catch(e){}}
function clearPin(){try{sessionStorage.removeItem('rlccDashPin')}catch(e){}}
function lockDashboard(){clearPin();showPinForm();}
function showPinForm(msg){
  document.getElementById('app').innerHTML='<div class="panel" style="max-width:420px;margin:40px auto;text-align:center"><h2>Leadership Dashboard</h2><p class="muted">Enter the dashboard PIN to continue.</p>'+(msg?'<div class="error" style="margin-bottom:12px">'+esc(msg)+'</div>':'')+'<input id="pin" type="password" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #d9e1d7;border-radius:10px;font-size:16px;margin-bottom:12px"><button class="refresh" style="background:#365233;color:#fff;width:100%" onclick="submitPin()">Open Dashboard</button></div>';
  var f=document.getElementById('pin');f.focus();f.addEventListener('keydown',function(ev){if(ev.key==='Enter')submitPin();});
}
function submitPin(){var v=document.getElementById('pin').value.trim();if(!v)return;setPin(v);loadDashboard();}
function loadDashboard(){
  var pin=getPin();
  if(!pin){showPinForm();return;}
  document.getElementById('app').innerHTML='<div class="loading">Loading assessment summary…</div>';
  google.script.run.withSuccessHandler(render).withFailureHandler(function(e){
    var m=(e&&e.message)||String(e);
    if(m.indexOf('ACCESS_DENIED')>-1){clearPin();showPinForm('That PIN was not correct. Please try again.');}
    else{document.getElementById('app').innerHTML='<div class="error">Unable to load the dashboard: '+esc(m)+'</div>';}
  }).getDashboardData(pin);
}
window.addEventListener('load',loadDashboard);
</script>
</body>
</html>
